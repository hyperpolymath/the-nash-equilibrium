# This workflow is managed by gh actions-lock.
name: Code Quality
on:
  push:
    branches: [main, master]
  pull_request:

# Estate guardrail: scope push to default branches so a PR fires once (not
# push+PR), and cancel superseded runs. Safe — read-only PR-triggered check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      
      - name: Check file permissions
        run: |
          find . -type f -perm /111 -name "*.sh" | head -10 || true
      
      - name: Check TODO/FIXME
        run: |
          echo "=== TODOs ==="
          grep -rn "TODO\|FIXME\|HACK\|XXX" --include="*.rs" --include="*.res" --include="*.py" --include="*.ex" . | head -20 || echo "None found"
      
      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path "./.git/*" | head -10 || echo "No large files"
      
      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@v2.2.0
        continue-on-error: true

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check documentation
        run: |
          MISSING=""
          [ ! -f "README.md" ] && [ ! -f "README.adoc" ] && MISSING="$MISSING README"
          [ ! -f "LICENSE" ] && [ ! -f "LICENSE.txt" ] && [ ! -f "LICENSE.md" ] && MISSING="$MISSING LICENSE"
          [ ! -f "CONTRIBUTING.md" ] && [ ! -f "CONTRIBUTING.adoc" ] && MISSING="$MISSING CONTRIBUTING"
          
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing docs:$MISSING"
          else
            echo "✅ Core documentation present"
          fi

      # The check above tests that doc files *exist*; this tests they *parse*.
      # Ruby ships preinstalled on ubuntu-latest, so no setup action is needed.
      - name: Install asciidoctor
        run: gem install asciidoctor --no-document

      - name: Check every .adoc renders
        run: ./scripts/check-docs-render.sh .

      # ...and that it renders *because it is AsciiDoc*, not because
      # Asciidoctor's Markdown-compat mode quietly accepted a Markdown body.
      # Needs no asciidoctor — it is a pure syntax scan.
      - name: Check every .adoc is AsciiDoc, not Markdown
        run: ./scripts/check-adoc-not-markdown.sh .
