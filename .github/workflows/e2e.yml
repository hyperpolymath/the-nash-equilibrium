#
# RSR Standard E2E + Aspect + Benchmark Workflow
#
# Covers ALL merge requirement test categories:
#   - E2E (end-to-end pipeline tests)
#   - Aspect (cross-cutting concern validation)
#   - Benchmarks (performance regression detection)
#   - Readiness (Component Readiness Grade: D/C/B)
#
# The default job below runs the repo's E2E harness (tests/e2e.sh) — it is a
# real gate, not a scaffold: an all-commented `jobs:` block parses as null and
# GitHub rejects the workflow at load time (zero jobs, red run, no check run).
# That is exactly how the previous version of this file failed every run; the
# template renamed its copy to e2e.yml.template to stop minting that defect
# (rsr-template-repo e2e.yml.template header).
#
# Stack-specific job blocks (Rust / Zig / Elixir / Playwright / readiness /
# benchmarks) live in rsr-template-repo .github/workflows/e2e.yml.template —
# uncomment the one matching your stack when the engine lands.

name: E2E + Aspect + Bench

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Default: harness smoke (always runs — not a silent no-op) ─────────────
  # Runs the repo's own E2E harness (tests/e2e.sh). Extend tests/e2e.sh with
  # project sections as the engine lands; no workflow edit required.
  e2e:
    name: E2E — harness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run E2E harness
        run: |
          if [ -f tests/e2e.sh ]; then
            bash tests/e2e.sh
          else
            echo "::notice::no tests/e2e.sh present — nothing to run"
          fi
